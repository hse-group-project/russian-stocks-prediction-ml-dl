# Настройки окружения
env:
  mlflow_tracking_uri: "http://localhost:5001"
  aws_access_key_id: "minioadmin"
  aws_secret_access_key: "minioadmin"
  mlflow_s3_endpoint_url: "http://localhost:9000"

# Эксперимент
experiment:
  name: "xgb_final_prd"
  run_name: "xgb_best_regression_v1"

# Гиперпараметры XGBoost (из Optuna)
model:
  colsample_bytree: 0.7133422283409027
  learning_rate: 0.06205653164661692
  max_depth: 3
  n_estimators: 264
  random_state: 42
  n_jobs: -1
  tree_method: "hist"

# Данные
data:
  left_dates:
    - "2025-07-01"
    - "2026-01-12"
    - "2026-01-31"
  right_dates:
    - "2025-09-01"
    - "2026-03-12"
    - "2026-03-31"
  train_period: 21
  val_period: 14
  test_period: 7
  step: 7
  top_n_features: 500
  processed_path: "mlflow/src/data/processed"

# Воспроизводимость
seed: 42

# Артефакты
artifacts:
  run_dir: "mlflow_artifacts"
  top_n_errors: 20
  noise_level: 0.01
